name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      # No dependency install step. The project has zero dependencies.
      # tests/test_real_ollama.py skips itself because OLLAMA_URL is not set here.
      - name: Unit and end-to-end tests (fake Ollama)
        run: python -m unittest discover -s tests -v
      - name: Line-count gate
        run: bash scripts/check_lines.sh
